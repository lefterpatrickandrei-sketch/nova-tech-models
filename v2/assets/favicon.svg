<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">NOVA Tech Models — Vernier Monogram Adaptive Symbol</title>
  <style>
    :root {
      --logo-ring: #C85A17;
      --logo-disc: #0F172A;
      --logo-n: #F4EFE6;
      --logo-wing: #EA580C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --logo-ring: #EA580C;
        --logo-disc: #F8FAFC;
        --logo-n: #0F172A;
        --logo-wing: #EA580C;
      }
    }
  </style>
  <g id="symbol">
    <circle cx="128" cy="128" r="108" fill="var(--logo-ring)"/>
    <circle cx="128" cy="128" r="100" fill="var(--logo-disc)"/>
    <path fill="var(--logo-n)" d="M72 184 V72 H104 L152 120 V72 L184 104 V184 H152 L104 136 V184 Z"/>
    <path fill="var(--logo-wing)" d="M152 72 H184 V104 Z"/>
  </g>
</svg>
