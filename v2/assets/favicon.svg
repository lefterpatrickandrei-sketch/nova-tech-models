  <!-- Rib Stations -->
  <path d="M20 31.5L19 35.8M25.5 28.2L25 34.8M38.5 28.2L39 34.8M44 31.5L45 35.8"
        stroke="#38BDF8" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

  <!-- Ascending FAI S7 Scale Rocket Silhouette (Ariane / Saturn Spire) -->
  <path d="M32 9L35.8 19.5V39.5L41 46.5V50L35.2 47.2L32 52L28.8 47.2L23 50V46.5L28.2 39.5V19.5L32 9Z"
        fill="url(#amberGrad)" stroke="#FDE68A" stroke-width="1" stroke-linejoin="round"/>

  <!-- Rocket Stage Rings & Center Telemetry Node -->
  <path d="M28.4 23H35.6M28.4 30H35.6M28.4 37H35.6" stroke="#0F172A" stroke-width="1.3"/>
  <circle cx="32" cy="26.5" r="2" fill="#F8FAFC"/>
