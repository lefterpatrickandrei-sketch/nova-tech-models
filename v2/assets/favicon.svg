<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#C85A17"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Rounded Octagonal / Technical Badge Base -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="#C85A17" stroke-width="2"/>

  <!-- Outer Vernier Compass Ring -->
  <circle cx="32" cy="32" r="24" stroke="#94A3B8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.55"/>
  <circle cx="32" cy="32" r="20" stroke="#38BDF8" stroke-width="0.75" opacity="0.35"/>

  <!-- Cardinal Crosshairs -->
  <path d="M32 5V10M32 54V59M5 32H10M54 32H59" stroke="#C85A17" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Swept Airfoil Wing & Structural Balsa Ribs -->
  <path d="M10 38C18 29 25 26 32 26C39 26 46 29 54 38C45 35.5 39 34.5 32 34.5C25 34.5 19 35.5 10 38Z"
