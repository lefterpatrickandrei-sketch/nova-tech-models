<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" fill="none">
  <defs>
    <linearGradient id="badgeBg" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="40" y1="24" x2="120" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#C85A17"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="wingCyan" x1="26" y1="84" x2="134" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="676" height="156" rx="20" fill="#0B111E" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Technical Grid Lines -->
  <path d="M168 24V136M2 40H678M2 120H678" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="4 4"/>

  <!-- Left Emblem Crest (Center: 84, 80) -->
  <g>
    <circle cx="84" cy="80" r="60" fill="url(#badgeBg)" stroke="#C85A17" stroke-width="2.2"/>
    <circle cx="84" cy="80" r="52" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
    <circle cx="84" cy="80" r="43" stroke="#38BDF8" stroke-width="0.9" opacity="0.4"/>

    <!-- Vernier Caliper Cardinal Ticks -->
    <path d="M84 14V23M84 137V146M18 80H27M141 80H150" stroke="#C85A17" stroke-width="2" stroke-linecap="round"/>
    <path d="M41 37L47 43M127 123L121 117M127 37L121 43M41 123L47 117" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

    <!-- Balsa Airfoil Wing Lattice -->
    <path d="M28 93C46 72 64 65 84 65C104 65 122 72 140 93C118 87 102 85 84 85C66 85 50 87 28 93Z"
          fill="#38BDF8" fill-opacity="0.14" stroke="url(#wingCyan)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Airfoil Structural Ribs -->
    <path d="M46 80L44 89M58 73L57 86.5M70 68L69 85.2M98 68L99 85.2M110 73L111 86.5M122 80L124 89"
          stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

    <!-- Ascending FAI S7 Scale Rocket Spire -->
    <path d="M84 25L93 50V96L106 113V121L91.5 114.5L84 126L76.5 114.5L62 121V113L75 96V50L84 25Z"
          fill="url(#copperGrad)" stroke="#FDE68A" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M75.5 58H92.5M75.5 74H92.5M75.5 90H92.5" stroke="#0B111E" stroke-width="1.8"/>
    <circle cx="84" cy="66" r="3.5" fill="#F8FAFC"/>
  </g>

  <!-- Right Editorial Typography Lockup -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" letter-spacing="2.5">
    <text x="192" y="45">SCARA 1:1 • CLASA FAI S7 • B1–P3</text>
  </g>

  <g font-family="Georgia, 'Instrument Serif', serif" font-size="42" font-weight="600" fill="#F8FAFC" letter-spacing="0.8">
    <text x="190" y="90">NOVA TECH MODELS</text>
  </g>

  <path d="M192 104H644" stroke="#C85A17" stroke-width="1.5" opacity="0.75"/>

  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1" letter-spacing="1.8">
    <text x="192" y="126">ATELIER CORNEL NISTOR • AEROMODELISM &amp; RACHETOMODELE</text>
  </g>
</svg>
